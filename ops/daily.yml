# Reference job for the external daily crawler (not run by default GitHub Actions in this repo).
# Production deploy pushes built `dist/` to the gh-pages branch outside this workflow.
# Site build entrypoint: python3 scripts/build.py (includes preflight.html + bundle).
name: Daily crawl reference
on:
  workflow_dispatch:
jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Crawl
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: python3 scripts/crawl.py
      - name: Build static site
        run: python3 scripts/build.py
      - name: Verify preflight artifacts
        run: test -f dist/preflight.html && test -f dist/preflight/preflight-browser.js
