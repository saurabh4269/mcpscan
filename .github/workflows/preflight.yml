name: MCP Preflight tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --prefix packages/mcp-preflight
      - run: npm test --prefix packages/mcp-preflight
