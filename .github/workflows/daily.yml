name: Daily crawl and deploy
on:
  schedule: [{cron: "30 2 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Crawl
        if: github.event_name != 'push'
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: python scripts/crawl.py
      - run: python scripts/build.py
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name mcpscan-bot; git config user.email actions@users.noreply.github.com
          git add data/servers.json; git commit -m "data: daily crawl" || true; git push || true
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
